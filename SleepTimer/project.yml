name: SleepTimer
options:
  bundleIdPrefix: com.glitcher

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0

targets:
  SleepTimer:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SleepTimer
    dependencies:
      - package: KeyboardShortcuts
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.glitcher.doze
      PRODUCT_NAME: Doze
      PRODUCT_MODULE_NAME: SleepTimer
      INFOPLIST_FILE: SleepTimer/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "1.0.1"
      CURRENT_PROJECT_VERSION: "2"
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_ENTITLEMENTS: SleepTimer/SleepTimer.entitlements
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 47Z9BFSWTD

  SleepTimerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SleepTimerTests
    settings:
      BUNDLE_LOADER: "$(TEST_HOST)"
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Doze.app/Contents/MacOS/Doze"
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.glitcher.doze.tests
      DEVELOPMENT_TEAM: 47Z9BFSWTD
      CODE_SIGN_STYLE: Automatic
      SWIFT_VERSION: "5.0"
    dependencies:
      - target: SleepTimer